title = "testmcpy gitleaks config"

# Extends gitleaks' built-in default ruleset (generic-api-key, aws, github,
# slack, private-key, etc.) rather than replacing it.
[extend]
useDefault = true

[allowlist]
description = "Known-safe fixtures, docs, and unit-test literals -- never real credentials"

# Placeholder domain the repo mandates in examples/docs instead of real
# infrastructure URLs (see CLAUDE.md: "No Preset Infrastructure URLs in Code").
regexes = [
  '''example\.com''',
]

# Files with intentionally fake secrets used to exercise the scrubber and
# auth-evaluator code paths, or docs showing sample tokens. Do NOT add
# tests/.results/, tests/.smoke_reports/, or tests/.generation_logs/ here --
# those directories hold live tool-call output and must never contain a real
# secret in the first place (see testmcpy/scrubber.py and .gitignore).
paths = [
  '''unit_tests/test_scrubber\.py''',
  '''unit_tests/test_hardening\.py''',
  '''unit_tests/test_advanced_auth\.py''',
  '''unit_tests/test_evaluators_advanced\.py''',
  '''examples/auth_evaluators_example\.py''',
  '''context/archives/AUTH_FLOW_DIAGRAM\.md''',
  '''context/concepts/authentication\.md''',
  '''docs-site/pages/concepts/authentication\.mdx''',
]
