name: Publish to PyPI

# Releases are requested by pushing a tag (see RELEASING.md):
#
#   vX.Y.Z   -> testmcpy X.Y.Z (and testmcpy-oauth-probe first, if its in-tree
#               version is not on PyPI yet)
#
# `v*` is the only release tag. The GitHub `pypi` environment's deployment policy
# admits only `v*` tags, so any other tag form would be rejected at the
# environment gate; do not add one here without extending that policy first.
# The tag version must equal the version in the tagged tree's pyproject.toml.
#
# Publishing uses PyPI Trusted Publishing (GitHub OIDC); there is no PyPI API
# token anywhere. The PyPI side trusts exactly this repository + this workflow
# filename (`publish.yml`) + the `pypi` environment. Do NOT rename this file or
# the environment without updating both PyPI projects' trusted-publisher settings.
#
# Three jobs, deliberately separated by privilege:
#
#   build     read-only, no OIDC. Runs repository code (tests, builds, installs).
#   publish   `id-token: write` + environment `pypi` (approval-gated). Runs NO
#             repository code: it downloads the build artifact, re-verifies it,
#             and uploads. Anything running here can mint a PyPI upload token.
#   homebrew  `contents: write` only, after a successful publish. No OIDC.
#
# Every action is pinned to a full commit SHA (version in the trailing comment).
# This is stricter than ci.yml's tag pins on purpose: this is the privileged path.

on:
  push:
    tags:
      - 'v*'

# One release per tag at a time; never cancel a release that is mid-flight.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history: the tag commit must be reachable from main
          persist-credentials: false

      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main; releases are cut from main only"
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install build and test tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine packaging pytest pyyaml

      # Fails the release when the tag is malformed, the tag version differs from
      # the package version, or the version is already on PyPI. Decides which
      # distributions this tag publishes.
      - name: Validate tag against package versions
        run: |
          mkdir -p release
          python scripts/release_check.py plan --tag "$GITHUB_REF_NAME" --output release/plan.json

      - name: Run release and packaging tests
        run: python -m pytest unit_tests/test_oauth_probe_packaging.py unit_tests/test_release_tooling.py -q

      # The `testmcpy` wheel ships the web UI that `testmcpy serve` serves. It is
      # built by npm and git-ignored, so a clean checkout has none; build it first.
      # `release_check.py verify-dists` fails the release if it is missing from the
      # wheel or the sdist. No npm cache: this is the privileged release path.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Build the web UI bundle
        run: |
          cd testmcpy/ui
          npm ci --no-audit --no-fund
          npm run build

      # Two distributions come out of this repo:
      #   testmcpy-oauth-probe  oauth-probe/ - httpx + pyyaml only; owns the
      #                         `testmcpy-oauth` console script
      #   testmcpy              everything else; hard-depends on the probe
      # Only what the plan lists is built, so nothing unplanned can be uploaded.
      - name: Build planned distributions
        run: |
          python scripts/release_check.py build --plan release/plan.json --release-dir release
          python -m twine check --strict release/*/*
          python scripts/release_check.py verify-dists --plan release/plan.json --release-dir release

      - name: Smoke-test installing the built artifacts in clean virtualenvs
        run: |
          if [ -d release/probe ]; then
            python -m venv /tmp/probe-venv
            /tmp/probe-venv/bin/pip install release/probe/*.whl
            /tmp/probe-venv/bin/testmcpy-oauth schema >/dev/null
            /tmp/probe-venv/bin/pip check
          fi
          if [ -d release/testmcpy ]; then
            python -m venv /tmp/testmcpy-venv
            # Install the probe wheel alongside when it is part of this release;
            # otherwise testmcpy must resolve the already-published probe from PyPI.
            /tmp/testmcpy-venv/bin/pip install release/testmcpy/*.whl $(ls release/probe/*.whl 2>/dev/null)
            /tmp/testmcpy-venv/bin/pip check
            /tmp/testmcpy-venv/bin/testmcpy --help >/dev/null
            /tmp/testmcpy-venv/bin/testmcpy-oauth schema >/dev/null
          fi

      - name: Record checksums
        run: (cd release && find . -type f ! -name SHA256SUMS | sort | xargs sha256sum > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-distributions
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI (approval required)
    needs: build
    runs-on: ubuntu-latest
    # The GitHub environment `pypi` exists with required reviewers and a `v*` tag
    # deployment policy. It must stay that way: GitHub creates a missing
    # environment on first use, unprotected, which would publish without approval,
    # so never push a release tag if the environment is missing or unprotected.
    # See RELEASING.md.
    environment:
      name: pypi
      url: https://pypi.org/project/testmcpy/
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); this job only
    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: release

      # No checkout and no repository code in this job. Re-derive everything from
      # the tag that triggered the run rather than trusting the build job's word.
      - name: Verify artifacts match the tag
        id: verify
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, sys

          tag = os.environ["GITHUB_REF_NAME"]
          release = pathlib.Path("release")

          # Validate the complete manifest before reading any paths from it.
          # sha256sum --check alone silently ignores files omitted from the list.
          entries = list(release.rglob("*"))
          if any(p.is_symlink() or not (p.is_file() or p.is_dir()) for p in entries):
              sys.exit("artifact contains a symlink or non-regular file")
          artifact_files = {
              p.relative_to(release).as_posix()
              for p in entries if p.is_file() and p != release / "SHA256SUMS"
          }
          checksums = {}
          for line in (release / "SHA256SUMS").read_text().splitlines():
              match = re.fullmatch(r"([0-9a-f]{64}) [ *](.+)", line)
              if not match:
                  sys.exit(f"malformed checksum entry: {line!r}")
              digest, filename = match.groups()
              path = pathlib.PurePosixPath(filename)
              if path.is_absolute() or ".." in path.parts or not path.parts or "\\" in filename:
                  sys.exit(f"unsafe checksum path: {filename!r}")
              filename = path.as_posix()
              if filename in checksums:
                  sys.exit(f"duplicate checksum path: {filename!r}")
              checksums[filename] = digest
          if set(checksums) != artifact_files:
              sys.exit(f"checksum manifest paths {sorted(checksums)} != artifact files {sorted(artifact_files)}")
          for filename, expected_digest in checksums.items():
              digest = hashlib.sha256()
              with (release / filename).open("rb") as artifact:
                  for chunk in iter(lambda: artifact.read(1024 * 1024), b""):
                      digest.update(chunk)
              if digest.hexdigest() != expected_digest:
                  sys.exit(f"checksum mismatch: {filename!r}")

          plan = json.loads((release / "plan.json").read_text())

          main = re.fullmatch(r"v(\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?)", tag)
          if not main:
              sys.exit(f"tag {tag!r} is not a release tag")
          if plan["tag"] != tag:
              sys.exit(f"plan is for {plan['tag']!r}, run is for {tag!r}")

          # The tag's version must be exactly the version of the dist it releases.
          version = main.group(1)
          planned = {d["name"]: d for d in plan["distributions"]}
          if "testmcpy" not in planned or planned["testmcpy"]["version"] != version:
              sys.exit(f"tag {tag!r} does not release testmcpy {version}: plan {plan['distributions']}")
          if not set(planned) <= {"testmcpy", "testmcpy-oauth-probe"}:
              sys.exit("unexpected distribution in plan")

          # Every uploaded file must be exactly <dist>-<version> and nothing else.
          dirs = {"testmcpy-oauth-probe": "probe", "testmcpy": "testmcpy"}
          expected_dirs = {dirs[n] for n in planned}
          actual_dirs = {p.name for p in release.iterdir() if p.is_dir()}
          if actual_dirs != expected_dirs:
              sys.exit(f"artifact dirs {sorted(actual_dirs)} != planned {sorted(expected_dirs)}")
          for name, dist in planned.items():
              stem = name.replace("-", "_") + "-" + dist["version"]
              files = sorted(p.name for p in (release / dirs[name]).iterdir())
              if len(files) != 2 or not any(f == stem + ".tar.gz" for f in files) or not any(
                  f.startswith(stem + "-") and f.endswith(".whl") for f in files
              ):
                  sys.exit(f"{name}: files {files} are not exactly the {version} wheel + sdist")

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a")
          out.write(f"publish_probe={'true' if 'testmcpy-oauth-probe' in planned else 'false'}\n")
          out.write(f"probe_version={plan['probe_version']}\n")
          PY

      # Ordering matters: testmcpy declares a hard dependency on
      # testmcpy-oauth-probe. Publishing testmcpy first would leave a window in
      # which `pip install testmcpy` cannot resolve.
      - name: Publish testmcpy-oauth-probe to PyPI
        if: steps.verify.outputs.publish_probe == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/probe/

      # Refuse to publish testmcpy against a probe version consumers cannot
      # install. Checks the exact in-tree probe version (not merely "something in
      # the allowed range"), whether it was just uploaded above or earlier.
      # Wheels only: downloading an sdist can execute its build backend, which
      # must never happen in this OIDC-enabled job.
      - name: Verify the probe dependency is installable from PyPI
        env:
          PROBE_VERSION: ${{ steps.verify.outputs.probe_version }}
        run: |
          REQUIRED="testmcpy-oauth-probe==${PROBE_VERSION}"
          echo "testmcpy requires a probe satisfying: ${REQUIRED}"
          for attempt in 1 2 3 4 5 6 7 8; do
            if python3 -m pip download --no-deps --only-binary=:all: --no-cache-dir --dest /tmp/probe-check "${REQUIRED}"; then
              exit 0
            fi
            echo "Not on PyPI yet; retrying in 15s (attempt ${attempt}/8)"
            sleep 15
          done
          echo "::error::${REQUIRED} is not installable from PyPI; refusing to publish testmcpy against it"
          exit 1

      - name: Publish testmcpy to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/testmcpy/

  homebrew:
    name: Sync Homebrew formula
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the formula update to main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      # Derives url + sha256 from the artifact PyPI actually serves and fails on
      # any bad download or digest mismatch. PyPI is already published at this
      # point: if this job fails, fix and use "Re-run failed jobs"; the publish
      # job is not repeated.
      - name: Update Formula/testmcpy.rb from the released sdist
        run: python3 scripts/update_homebrew_formula.py "${GITHUB_REF_NAME#v}"

      - name: Commit and push the formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- Formula/testmcpy.rb; then
            echo "Formula already current for ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/testmcpy.rb
          git commit -m "chore: update Homebrew formula for ${VERSION}"
          # A failed push fails the job; main moving underneath us gets rebased and retried.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "::error::could not push the formula update to main"
          exit 1
